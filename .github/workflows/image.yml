---
# Publishes the sample app image to GitHub Container Registry.
# Pushing a tag such as v1.2.0 produces ghcr.io/<owner>/zero-downtime-iac-app:1.2.0.
# Only the built-in GITHUB_TOKEN is needed.
name: Publish image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lower-cases the name, as GHCR requires.
          images: ghcr.io/${{ github.repository_owner }}/zero-downtime-iac-app
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
